<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A Jornada do Cavaleiro (Knight's Quest)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var div = document.createElement('div');
        div.id = 'debug-error-box';
        div.style = 'position:fixed;top:10px;left:10px;z-index:99999;background:rgba(0,0,0,0.92);color:#ff5252;padding:20px;font-family:monospace;font-size:16px;border:2px solid #ff5252;max-width:90%;word-wrap:break-word;';
        div.innerHTML = '<h3>ERRO ENCONTRADO:</h3><p><b>Mensagem:</b> ' + msg + '</p><p><b>Linha:</b> ' + lineNo + ':' + columnNo + '</p><p><b>Stack:</b> ' + (error ? error.stack : 'N/A') + '</p>';
        document.body.appendChild(div);
        console.error('DEBUG-GLOBAL-ERROR:', msg, lineNo, error);
      };
    </script>
    <!-- Configuração & Constantes Globais -->
    <script src="src/config/constants.js"></script>
    <script src="src/config/palette.js"></script>
    <script src="src/config/catalogs.js"></script>

    <!-- Núcleo do Jogo (Core Systems & State) -->
    <script src="src/core/events.js"></script>
    <script src="src/core/state.js"></script>
    <script src="src/core/storage.js"></script>
    <script src="src/core/audio.js"></script>

    <!-- Arte Procedural & Texturas -->
    <script src="src/art/drawHelpers.js"></script>
    <script src="src/art/characterArt.js"></script>
    <script src="src/art/itemArt.js"></script>
    <script src="src/art/worldArt.js"></script>

    <!-- Combate, Armas & Loot -->
    <script src="src/combat/weapons.js"></script>
    <script src="src/combat/combatManager.js"></script>
    <script src="src/combat/lootManager.js"></script>

    <!-- Mundo, Inimigos & Chefes -->
    <script src="src/world/director.js"></script>
    <script src="src/world/enemies.js"></script>
    <script src="src/world/boss.js"></script>

    <!-- Interface de Usuário (UI) & Controles Mobile -->
    <script src="src/ui/hud.js"></script>
    <script src="src/ui/modals.js"></script>
    <script src="src/ui/menus.js"></script>
    <script src="src/ui/virtualJoystick.js"></script>

    <!-- Inicialização do Phaser & Ciclo de Vida -->
    <script src="src/main.js"></script>
    <!-- Fallback / Bundle de Arquivo Único Legado: <script src="game.js"></script> -->
</body>
</html>
